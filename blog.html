<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rokunujjaman - Personal Blog with reactions and nested comments">
    <title>Blog - Rokunujjaman</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="blog-styles.css">
</head>
<body class="minimal">
    <header class="site-header">
        <nav class="navbar navbar-fixed-top" aria-label="Primary Navigation">
            <div class="nav-container">
                <a href="index.html" class="nav-brand">Rokunujjaman</a>
                <button type="button" class="navbar-toggle" id="menu-toggle" aria-label="Toggle navigation">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <div class="navbar-collapse" id="navbar-collapse">
                    <ul class="nav-list">
                        <li><a href="index.html">01 : Home</a></li>
                        <li><a href="resume.html">02 : Resume</a></li>
                        <li class="active"><a href="blog.html">03 : Blog</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section class="blog-hero-v2">
        <div class="blog-hero-bg"></div>
        <div class="container blog-hero-inner">
            <span class="blog-badge">✦ Blog</span>
            <h1 class="blog-hero-title-v2">Thoughts, Ideas <br>&amp; Insights</h1>
            <p class="blog-hero-subtitle-v2">Read, react, and join the conversation</p>
        </div>
    </section>

    <main class="blog-main-v2">
        <div class="container">
            <div class="blog-toolbar-v2">
                <div class="blog-toolbar-left">
                    <h2 class="blog-feed-heading">Latest Posts</h2>
                    <p id="blog-count" class="blog-feed-count">Loading posts...</p>
                </div>
                <button type="button" class="btn-refresh" id="refresh-posts" title="Refresh posts">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    <span>Refresh</span>
                </button>
            </div>

            <div id="blog-feed" class="blog-feed-v2"></div>
        </div>
    </main>

    <footer class="footer-container text-center">
        <div class="container">
            <p class="footer-quote">Keep Smiling :)</p>
            <p class="footer-copy">&copy; Rokunujjaman 2026</p>
        </div>
    </footer>

    <p id="post-form-status" class="form-status sr-only" aria-live="polite"></p>

    <script src="blog-client.js"></script>
    <script src="script.js"></script>
</body>
</html>

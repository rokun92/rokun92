<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Rokunujjaman</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ---- Admin Dark Theme ---- */
        :root {
            --admin-bg: #0a0e1a;
            --admin-surface: rgba(255,255,255,0.04);
            --admin-glass: rgba(255,255,255,0.06);
            --admin-border: rgba(255,255,255,0.08);
            --admin-text: #e2e8f0;
            --admin-muted: #64748b;
            --admin-accent: #6366f1;
            --admin-accent-glow: rgba(99,102,241,0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--admin-bg);
            background-image:
                radial-gradient(ellipse 600px 400px at 30% 20%, rgba(99,102,241,0.08), transparent),
                radial-gradient(ellipse 500px 400px at 70% 80%, rgba(139,92,246,0.06), transparent);
            color: var(--admin-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .admin-container {
            width: 100%;
            max-width: 520px;
            padding: 24px;
        }

        /* ---- Glass Card ---- */
        .glass-card {
            background: var(--admin-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--admin-border);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow:
                0 8px 32px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: slideUp 0.5s ease both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-icon {
            font-size: 2.4rem;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #f1f5f9, #94a3b8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-subtitle {
            font-size: 0.88rem;
            color: var(--admin-muted);
            margin-top: 4px;
        }

        /* ---- Forms ---- */
        .admin-form { display: grid; gap: 16px; }

        .form-group { display: grid; gap: 6px; }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            background: var(--admin-surface);
            color: var(--admin-text);
            font: inherit;
            font-size: 0.95rem;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-textarea {
            resize: vertical;
            min-height: 150px;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--admin-accent);
            box-shadow: 0 0 0 3px var(--admin-accent-glow);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: #475569;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px var(--admin-accent-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .form-error {
            text-align: center;
            color: #f87171;
            font-size: 0.88rem;
            font-weight: 500;
            min-height: 1.4em;
        }

        .form-status {
            text-align: center;
            font-size: 0.88rem;
            min-height: 1.4em;
            margin-top: 4px;
        }

        /* ---- Dashboard header ---- */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn-logout {
            padding: 8px 16px;
            border: 1px solid var(--admin-border);
            border-radius: 10px;
            background: transparent;
            color: #94a3b8;
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: rgba(239,68,68,0.1);
            border-color: rgba(239,68,68,0.3);
            color: #f87171;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            color: var(--admin-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .btn-back:hover {
            color: var(--admin-text);
        }

        /* ---- Utility ---- */
        .hidden { display: none !important; }

        @media (max-width: 560px) {
            .glass-card { padding: 24px 20px; border-radius: 18px; }
            .admin-container { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="admin-container">

        <!-- Login Section -->
        <div id="admin-login" class="glass-card">
            <div class="card-header">
                <div class="card-icon">🔐</div>
                <h1 class="card-title">Admin Access</h1>
                <p class="card-subtitle">Enter your password to manage posts</p>
            </div>
            <form id="admin-login-form" class="admin-form">
                <div class="form-group">
                    <label class="form-label" for="admin-password">Password</label>
                    <input
                        type="password"
                        name="password"
                        id="admin-password"
                        class="form-input"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <p id="login-error" class="form-error"></p>
                <button type="submit" class="btn-primary">Unlock</button>
            </form>
        </div>

        <!-- Dashboard Section (hidden by default) -->
        <div id="admin-dashboard" class="glass-card hidden">
            <div class="dashboard-header">
                <div>
                    <h1 class="card-title" style="font-size:1.3rem;">Publish a Post</h1>
                    <p class="card-subtitle">Create a new blog entry</p>
                </div>
                <button type="button" id="admin-logout" class="btn-logout">Logout</button>
            </div>

            <form id="admin-post-form" class="admin-form">
                <div class="form-group">
                    <label class="form-label" for="post-title">Title</label>
                    <input
                        type="text"
                        name="title"
                        id="post-title"
                        class="form-input"
                        maxlength="120"
                        placeholder="What are you writing about?"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="post-author">Author</label>
                    <input
                        type="text"
                        name="author"
                        id="post-author"
                        class="form-input"
                        maxlength="80"
                        value="Rokunujjaman"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="post-content">Content</label>
                    <textarea
                        name="content"
                        id="post-content"
                        class="form-textarea"
                        maxlength="4000"
                        placeholder="Write your post here..."
                        required
                    ></textarea>
                </div>
                <p id="admin-post-status" class="form-status"></p>
                <button type="submit" class="btn-primary">🚀 Publish Post</button>
            </form>

            <a href="blog.html" class="btn-back">← Back to blog</a>
        </div>

    </div>

    <script src="blog-client.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Blog</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f1a; --surface: #111827; --border: #1e2d45;
    --accent: #38bdf8; --accent2: #818cf8; --green: #34d399;
    --text: #e2e8f0; --muted: #64748b;
    --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14.5px; line-height: 1.6; min-height: 100vh; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; height: 56px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .nav-logo { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  #logout-btn { display:none; background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); font-size: 12px; padding: .4rem .9rem; border-radius: 6px; cursor: pointer; }
  #logout-btn:hover { border-color: var(--accent); color: var(--accent); }

  main { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 5rem; }

  /* ── LOGIN ── */
  #login-view { max-width: 360px; margin: 4rem auto 0; }
  .login-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; }
  .field-label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; display: block; margin-bottom: .4rem; margin-top: 1rem; }
  input, textarea, select {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: .65rem .85rem; color: var(--text); font-family: var(--sans); font-size: 13.5px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .65rem 1.5rem; border-radius: 6px; font-size: 13px; font-family: var(--mono); letter-spacing: .05em; text-decoration: none; transition: all .2s; cursor: pointer; border: none; }
  .btn-primary { background: var(--accent); color: #0b0f1a; font-weight: 700; }
  .btn-primary:hover { background: #7dd3fc; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: transparent; color: #f87171; border: 1px solid rgba(248,113,113,.3); }
  .btn-danger:hover { background: rgba(248,113,113,.08); }
  #login-error { color: #f87171; font-family: var(--mono); font-size: 12px; margin-top: .8rem; min-height: 1em; }

  /* ── DASHBOARD ── */
  #dashboard-view { display: none; }
  .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
  .dash-title { font-size: 1.6rem; font-weight: 600; }

  .post-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 1rem 1.3rem; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: .7rem; gap: 1rem; flex-wrap: wrap;
  }
  .post-row-title { font-weight: 600; font-size: 14px; }
  .post-row-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: .3rem; }
  .status-pill { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-left: .5rem; }
  .status-pill.published { background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.25); }
  .status-pill.draft { background: rgba(148,163,184,.1); color: var(--muted); border: 1px solid var(--border); }
  .post-row-actions { display: flex; gap: .5rem; }
  .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: .35rem .7rem; border-radius: 6px; cursor: pointer; font-family: var(--mono); font-size: 11px; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger:hover { border-color: #f87171; color: #f87171; }

  /* ── EDITOR ── */
  #editor-view { display: none; }
  .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .form-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .form-row > div { flex: 1; min-width: 200px; }
  textarea#content-field { min-height: 380px; font-family: var(--mono); font-size: 13px; resize: vertical; }
  .editor-actions { display: flex; gap: .8rem; margin-top: 1.5rem; align-items: center; }
  .save-status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .checkbox-row { display: flex; align-items: center; gap: .5rem; margin-top: 1rem; }
  .checkbox-row input { width: auto; }
  .hint { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: .4rem; }
</style>
</head>
<body>

<nav>
  <span class="nav-logo">rokun@blog:~/admin$</span>
  <button id="logout-btn">logout</button>
</nav>

<main>
  <!-- LOGIN -->
  <div id="login-view">
    <h1 class="login-title">Admin Login</h1>
    <label class="field-label">Email</label>
    <input type="email" id="login-email" placeholder="you@example.com">
    <label class="field-label">Password</label>
    <input type="password" id="login-password" placeholder="••••••••">
    <div style="margin-top:1.5rem;">
      <button class="btn btn-primary" id="login-btn" style="width:100%; justify-content:center;">Sign in</button>
    </div>
    <div id="login-error"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-view">
    <div class="dash-header">
      <h1 class="dash-title">Posts</h1>
      <button class="btn btn-primary" id="new-post-btn">+ New post</button>
    </div>
    <div id="posts-list"></div>
  </div>

  <!-- EDITOR -->
  <div id="editor-view">
    <div class="editor-header">
      <h1 class="dash-title" id="editor-heading">New post</h1>
      <button class="btn btn-ghost" id="back-to-list-btn">← back to list</button>
    </div>

    <label class="field-label">Title</label>
    <input type="text" id="title-field" placeholder="Post title">

    <label class="field-label">Slug (URL)</label>
    <input type="text" id="slug-field" placeholder="auto-generated-from-title">
    <div class="hint">Final URL: rokun92.github.io/blog/post.html?slug=your-slug</div>

    <label class="field-label">Excerpt</label>
    <textarea id="excerpt-field" style="min-height:70px;" placeholder="One or two sentence summary shown on the blog list"></textarea>

    <label class="field-label">Tags (comma separated)</label>
    <input type="text" id="tags-field" placeholder="backend, postgresql, docker">

    <label class="field-label">Content (Markdown supported)</label>
    <textarea id="content-field" placeholder="# Write your post in Markdown..."></textarea>

    <div class="checkbox-row">
      <input type="checkbox" id="published-field" checked>
      <label for="published-field" style="font-size:13px;">Published (visible publicly)</label>
    </div>

    <div class="editor-actions">
      <button class="btn btn-primary" id="save-post-btn">Save post</button>
      <span class="save-status" id="save-status"></span>
    </div>
  </div>
</main>

<script src="/config.js"></script>
<script src="../assets/supabase-config.js"></script>
<script>
  let editingPostId = null;
  let slugManuallyEdited = false;

  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const editorView = document.getElementById('editor-view');
  const logoutBtn = document.getElementById('logout-btn');

  function showView(view) {
    [loginView, dashboardView, editorView].forEach(v => v.style.display = 'none');
    view.style.display = 'block';
  }

  async function checkSession() {
    const { data } = await sb.auth.getSession();
    if (data.session) {
      logoutBtn.style.display = 'inline-block';
      showView(dashboardView);
      loadPosts();
    } else {
      logoutBtn.style.display = 'none';
      showView(loginView);
    }
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = error.message;
      return;
    }
    checkSession();
  });

  logoutBtn.addEventListener('click', async () => {
    await sb.auth.signOut();
    checkSession();
  });

  async function loadPosts() {
    const { data, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
    const list = document.getElementById('posts-list');
    if (error) {
      list.innerHTML = `<p style="color:#f87171;">Error loading posts: ${error.message}</p>`;
      return;
    }
    if (!data || data.length === 0) {
      list.innerHTML = `<p style="color:var(--muted);">No posts yet. Click "New post" to write your first one.</p>`;
      return;
    }
    list.innerHTML = data.map(p => `
      <div class="post-row">
        <div>
          <span class="post-row-title">${escapeHtml(p.title)}</span>
          <span class="status-pill ${p.published ? 'published' : 'draft'}">${p.published ? 'published' : 'draft'}</span>
          <div class="post-row-meta">/${p.slug} · ${new Date(p.created_at).toLocaleDateString()} · ${p.views || 0} views</div>
        </div>
        <div class="post-row-actions">
          <button class="icon-btn" onclick="editPost('${p.id}')">Edit</button>
          <a class="icon-btn" href="post.html?slug=${encodeURIComponent(p.slug)}" target="_blank">View</a>
          <button class="icon-btn danger" onclick="deletePost('${p.id}', '${escapeHtml(p.title).replace(/'/g, "\\'")}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  document.getElementById('new-post-btn').addEventListener('click', () => openEditor(null));
  document.getElementById('back-to-list-btn').addEventListener('click', () => { showView(dashboardView); loadPosts(); });

  async function openEditor(post) {
    editingPostId = post ? post.id : null;
    slugManuallyEdited = !!post;
    document.getElementById('editor-heading').textContent = post ? 'Edit post' : 'New post';
    document.getElementById('title-field').value = post ? post.title : '';
    document.getElementById('slug-field').value = post ? post.slug : '';
    document.getElementById('excerpt-field').value = post ? (post.excerpt || '') : '';
    document.getElementById('tags-field').value = post ? (post.tags || []).join(', ') : '';
    document.getElementById('content-field').value = post ? post.content : '';
    document.getElementById('published-field').checked = post ? post.published : true;
    document.getElementById('save-status').textContent = '';
    showView(editorView);
  }

  window.editPost = async function(id) {
    const { data, error } = await sb.from('posts').select('*').eq('id', id).single();
    if (error) { alert('Failed to load post: ' + error.message); return; }
    openEditor(data);
  };

  window.deletePost = async function(id, title) {
    if (!confirm(`Delete "${title}"? This also deletes its comments and reactions. This can't be undone.`)) return;
    const { error } = await sb.from('posts').delete().eq('id', id);
    if (error) { alert('Delete failed: ' + error.message); return; }
    loadPosts();
  };

  document.getElementById('title-field').addEventListener('input', (e) => {
    if (!slugManuallyEdited) {
      document.getElementById('slug-field').value = slugify(e.target.value);
    }
  });
  document.getElementById('slug-field').addEventListener('input', () => { slugManuallyEdited = true; });

  document.getElementById('save-post-btn').addEventListener('click', async () => {
    const status = document.getElementById('save-status');
    const title = document.getElementById('title-field').value.trim();
    let slug = document.getElementById('slug-field').value.trim() || slugify(title);
    const excerpt = document.getElementById('excerpt-field').value.trim();
    const tags = document.getElementById('tags-field').value.split(',').map(t => t.trim()).filter(Boolean);
    const content = document.getElementById('content-field').value;
    const published = document.getElementById('published-field').checked;

    if (!title || !content) {
      status.textContent = 'Title and content are required.';
      status.style.color = '#f87171';
      return;
    }

    status.textContent = 'Saving…';
    status.style.color = 'var(--muted)';

    const payload = { title, slug, excerpt, tags, content, published, updated_at: new Date().toISOString() };

    let error;
    if (editingPostId) {
      ({ error } = await sb.from('posts').update(payload).eq('id', editingPostId));
    } else {
      ({ error } = await sb.from('posts').insert(payload));
    }

    if (error) {
      status.textContent = 'Error: ' + error.message;
      status.style.color = '#f87171';
      return;
    }

    status.textContent = 'Saved!';
    status.style.color = 'var(--green)';
    setTimeout(() => { showView(dashboardView); loadPosts(); }, 500);
  });

  checkSession();
</script>
</body>
</html>

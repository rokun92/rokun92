<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog — Rokunujjaman Rokun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0b0f1a;
    --surface:   #111827;
    --border:    #1e2d45;
    --accent:    #38bdf8;
    --accent2:   #818cf8;
    --green:     #34d399;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.65; min-height: 100vh; }

  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    background: rgba(11,15,26,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2.5rem; height: 56px;
  }
  .nav-logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.05em; text-decoration: none; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-size: 13px; color: var(--muted); text-decoration: none; font-family: var(--mono); letter-spacing: 0.04em; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--accent); }

  main { max-width: 900px; margin: 0 auto; padding: 6.5rem 2.5rem 5rem; }
  .page-eyebrow { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: .75rem; }
  .page-title { font-size: 2.2rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: .6rem; }
  .page-desc { color: #94a3b8; max-width: 560px; margin-bottom: 3rem; }

  .posts-grid { display: grid; gap: 1.2rem; }
  .post-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 1.6rem 1.8rem; text-decoration: none; color: inherit;
    transition: border-color .2s, transform .2s; display: block;
  }
  .post-card:hover { border-color: var(--accent2); transform: translateY(-2px); }
  .post-date { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .1em; margin-bottom: .5rem; }
  .post-title { font-weight: 600; font-size: 1.15rem; margin-bottom: .5rem; }
  .post-excerpt { font-size: 13.5px; color: #94a3b8; line-height: 1.65; }
  .post-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; }
  .post-tag { font-family: var(--mono); font-size: 11px; color: #7dd3fc; background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.15); padding: 2px 8px; border-radius: 4px; }
  .post-meta-row { display: flex; gap: 1rem; margin-top: 1rem; font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .empty-state, .loading-state { color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 2rem 0; }

  footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 12px; font-family: var(--mono); border-top: 1px solid var(--border); }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="../index.html">rokun@portfolio:~$</a>
  <ul class="nav-links">
    <li><a href="../index.html">home</a></li>
    <li><a href="../index.html#projects">projects</a></li>
    <li><a href="index.html" class="active">blog</a></li>
    <li><a href="../index.html#contact">contact</a></li>
  </ul>
</nav>

<main>
  <div class="page-eyebrow">// writing</div>
  <h1 class="page-title">Blog</h1>
  <p class="page-desc">Notes on backend engineering, competitive programming, and things I'm learning along the way.</p>

  <div id="posts" class="posts-grid">
    <div class="loading-state">Loading posts…</div>
  </div>
</main>

<footer>
  <p>Rokunujjaman Rokun © 2026 · <a href="../index.html" style="color:var(--accent)">back to portfolio</a></p>
</footer>

<script src="/config.js"></script>
<script src="../assets/supabase-config.js"></script>
<script>
  async function loadPosts() {
    const container = document.getElementById('posts');
    const { data, error } = await sb
      .from('posts')
      .select('slug,title,excerpt,tags,created_at,views')
      .eq('published', true)
      .order('created_at', { ascending: false });

    if (error) {
      container.innerHTML = `<div class="empty-state">Couldn't load posts. Check your Supabase config in assets/supabase-config.js.</div>`;
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = `<div class="empty-state">No posts yet — check back soon.</div>`;
      return;
    }

    container.innerHTML = data.map(post => {
      const date = new Date(post.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      const tags = (post.tags || []).map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('');
      return `
        <a class="post-card" href="post.html?slug=${encodeURIComponent(post.slug)}">
          <div class="post-date">${date}</div>
          <div class="post-title">${escapeHtml(post.title)}</div>
          <div class="post-excerpt">${escapeHtml(post.excerpt || '')}</div>
          ${tags ? `<div class="post-tags">${tags}</div>` : ''}
          <div class="post-meta-row"><span>${post.views || 0} views</span></div>
        </a>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadPosts();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Post — Rokunujjaman Rokun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0b0f1a;
    --surface:   #111827;
    --border:    #1e2d45;
    --accent:    #38bdf8;
    --accent2:   #818cf8;
    --green:     #34d399;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.65; min-height: 100vh; }

  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    background: rgba(11,15,26,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2.5rem; height: 56px;
  }
  .nav-logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.05em; text-decoration: none; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-size: 13px; color: var(--muted); text-decoration: none; font-family: var(--mono); letter-spacing: 0.04em; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--accent); }

  main { max-width: 720px; margin: 0 auto; padding: 6.5rem 2.5rem 5rem; }
  .back-link { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 2rem; }
  .back-link:hover { color: var(--accent); }

  .post-date { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-bottom: .75rem; }
  .post-title { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 1rem; }
  .post-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 2.5rem; }
  .post-tag { font-family: var(--mono); font-size: 11px; color: #7dd3fc; background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.15); padding: 2px 8px; border-radius: 4px; }

  .post-body { color: #cbd5e1; font-size: 15.5px; line-height: 1.8; }
  .post-body h1, .post-body h2, .post-body h3 { color: var(--text); margin: 2rem 0 1rem; line-height: 1.3; }
  .post-body h2 { font-size: 1.4rem; }
  .post-body h3 { font-size: 1.15rem; }
  .post-body p { margin-bottom: 1.2rem; }
  .post-body a { color: var(--accent); }
  .post-body code { font-family: var(--mono); background: var(--surface); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .post-body pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.2rem; overflow-x: auto; margin-bottom: 1.2rem; }
  .post-body pre code { border: none; padding: 0; background: none; }
  .post-body ul, .post-body ol { margin: 0 0 1.2rem 1.4rem; }
  .post-body blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; color: var(--muted); margin-bottom: 1.2rem; }
  .post-body img { max-width: 100%; border-radius: 8px; margin: 1rem 0; }

  /* ── REACTIONS + SHARE ── */
  .engage-bar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    margin: 3rem 0; padding: 1.2rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .reactions { display: flex; gap: .6rem; }
  .reaction-btn {
    display: flex; align-items: center; gap: .4rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: .4rem .9rem; cursor: pointer; font-size: 13px; color: var(--text);
    transition: border-color .2s, transform .15s;
  }
  .reaction-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .reaction-btn.active { border-color: var(--accent); background: rgba(56,189,248,.1); color: var(--accent); }
  .reaction-count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .share-links { display: flex; gap: .6rem; }
  .share-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    text-decoration: none; cursor: pointer; transition: border-color .2s, color .2s;
  }
  .share-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .share-btn svg { width: 16px; height: 16px; }

  /* ── COMMENTS ── */
  .comments-section { margin-top: 3rem; }
  .comments-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; }
  .comment-form { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.4rem; margin-bottom: 2rem; }
  .comment-form-row { display: flex; gap: .8rem; margin-bottom: .8rem; flex-wrap: wrap; }
  .comment-form input, .comment-form textarea {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: .6rem .8rem; color: var(--text); font-family: var(--sans); font-size: 13.5px;
    flex: 1; min-width: 180px; resize: vertical;
  }
  .comment-form input:focus, .comment-form textarea:focus { outline: none; border-color: var(--accent); }
  .comment-form textarea { width: 100%; min-height: 90px; }
  .comment-submit {
    background: var(--accent); color: #0b0f1a; font-weight: 700; border: none;
    padding: .6rem 1.4rem; border-radius: 6px; font-family: var(--mono); font-size: 13px;
    cursor: pointer; letter-spacing: .04em;
  }
  .comment-submit:hover { background: #7dd3fc; }
  .comment-status { font-family: var(--mono); font-size: 12px; margin-top: .6rem; color: var(--muted); }

  .comment-item { border-bottom: 1px solid var(--border); padding: 1.1rem 0; }
  .comment-head { display: flex; align-items: baseline; gap: .7rem; margin-bottom: .4rem; }
  .comment-name { font-weight: 600; font-size: 13.5px; }
  .comment-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .comment-content { color: #94a3b8; font-size: 13.5px; line-height: 1.6; }

  footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 12px; font-family: var(--mono); border-top: 1px solid var(--border); }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/index.html">rokun@portfolio:~$</a>
  <ul class="nav-links">
    <li><a href="/index.html">home</a></li>
    <li><a href="/index.html#projects">projects</a></li>
    <li><a href="index.html" class="active">blog</a></li>
    <li><a href="/index.html#contact">contact</a></li>
  </ul>
</nav>

<main>
  <a class="back-link" href="index.html">← back to blog</a>

  <div id="post-container">
    <p style="color:var(--muted); font-family: var(--mono); font-size:13px;">Loading…</p>
  </div>

  <div id="engage-container"></div>

  <section class="comments-section" id="comments-section" style="display:none;">
    <h3 class="comments-title" id="comments-title">Comments</h3>

    <div class="comment-form">
      <div class="comment-form-row">
        <input type="text" id="comment-name" placeholder="Your name" maxlength="60" required>
        <input type="email" id="comment-email" placeholder="Email (optional, not shown publicly)" maxlength="120">
      </div>
      <textarea id="comment-content" placeholder="Share your thoughts…" maxlength="2000" required></textarea>
      <div style="margin-top:.8rem; display:flex; align-items:center; gap:1rem;">
        <button class="comment-submit" id="comment-submit">Post comment</button>
        <span class="comment-status" id="comment-status"></span>
      </div>
    </div>

    <div id="comments-list"></div>
  </section>
</main>

<footer>
  <p>Rokunujjaman Rokun © 2025 · <a href="/index.html" style="color:var(--accent)">back to portfolio</a></p>
</footer>

<script src="/api/config.js"></script>
<script src="/assets/supabase-config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  let currentPost = null;
  const REACTION_TYPES = [
    { type: 'like', emoji: '👍', label: 'Like' },
    { type: 'love', emoji: '❤️', label: 'Love' },
    { type: 'clap', emoji: '👏', label: 'Clap' },
    { type: 'insightful', emoji: '💡', label: 'Insightful' },
  ];

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function loadPost() {
    if (!slug) {
      document.getElementById('post-container').innerHTML = `<p style="color:var(--muted)">No post specified.</p>`;
      return;
    }
    const { data, error } = await sb.from('posts').select('*').eq('slug', slug).eq('published', true).single();
    if (error || !data) {
      document.getElementById('post-container').innerHTML = `<p style="color:var(--muted)">Post not found.</p>`;
      return;
    }
    currentPost = data;
    renderPost(data);
    incrementViews(data.id, data.views);
    renderEngageBar(data.id);
    loadComments(data.id);
    document.title = data.title + ' — Rokunujjaman Rokun';
  }

  function renderPost(post) {
    const date = new Date(post.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    const tags = (post.tags || []).map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('');
    const rawHtml = marked.parse(post.content || '');
    const cleanHtml = DOMPurify.sanitize(rawHtml);
    document.getElementById('post-container').innerHTML = `
      <div class="post-date">${date}</div>
      <h1 class="post-title">${escapeHtml(post.title)}</h1>
      ${tags ? `<div class="post-tags">${tags}</div>` : ''}
      <div class="post-body">${cleanHtml}</div>
    `;
  }

  async function incrementViews(postId, currentViews) {
    await sb.from('posts').update({ views: (currentViews || 0) + 1 }).eq('id', postId);
  }

  async function renderEngageBar(postId) {
    const sessionId = getSessionId();
    const { data: reactions } = await sb.from('reactions').select('reaction_type,session_id').eq('post_id', postId);
    const counts = {};
    const mine = new Set();
    (reactions || []).forEach(r => {
      counts[r.reaction_type] = (counts[r.reaction_type] || 0) + 1;
      if (r.session_id === sessionId) mine.add(r.reaction_type);
    });

    const reactionsHtml = REACTION_TYPES.map(r => `
      <button class="reaction-btn ${mine.has(r.type) ? 'active' : ''}" data-type="${r.type}">
        <span>${r.emoji}</span>
        <span class="reaction-count">${counts[r.type] || 0}</span>
      </button>
    `).join('');

    const shareUrl = window.location.href;
    document.getElementById('engage-container').innerHTML = `
      <div class="engage-bar">
        <div class="reactions">${reactionsHtml}</div>
        <div class="share-links">
          <a class="share-btn" title="Share on X" target="_blank" href="https://twitter.com/intent/tweet?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(currentPost.title)}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22H16.9l-5-6.5-5.7 6.5H2.9l8.1-9.3L2 2h6.6l4.5 6 5.8-6zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20z"/></svg>
          </a>
          <a class="share-btn" title="Share on LinkedIn" target="_blank" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.37V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.35-1.85 3.58 0 4.24 2.36 4.24 5.43v6.31zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
          </a>
          <button class="share-btn" title="Copy link" id="copy-link-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </button>
        </div>
      </div>
    `;

    document.querySelectorAll('.reaction-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleReaction(postId, btn.dataset.type, sessionId));
    });
    document.getElementById('copy-link-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(shareUrl);
      const btn = document.getElementById('copy-link-btn');
      btn.style.color = 'var(--green)';
      setTimeout(() => btn.style.color = '', 1200);
    });
  }

  async function toggleReaction(postId, type, sessionId) {
    const { data: existing } = await sb.from('reactions').select('id')
      .eq('post_id', postId).eq('session_id', sessionId).eq('reaction_type', type).maybeSingle();

    if (existing) {
      await sb.from('reactions').delete().eq('id', existing.id);
    } else {
      await sb.from('reactions').insert({ post_id: postId, reaction_type: type, session_id: sessionId });
    }
    renderEngageBar(postId);
  }

  async function loadComments(postId) {
    const section = document.getElementById('comments-section');
    section.style.display = 'block';

    const { data, error } = await sb.from('comments').select('*')
      .eq('post_id', postId).eq('approved', true).order('created_at', { ascending: false });

    const list = document.getElementById('comments-list');
    document.getElementById('comments-title').textContent = `Comments (${(data || []).length})`;

    if (error || !data || data.length === 0) {
      list.innerHTML = `<p style="color:var(--muted); font-size:13px;">No comments yet — be the first to share your thoughts.</p>`;
      return;
    }

    list.innerHTML = data.map(c => {
      const date = new Date(c.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      return `
        <div class="comment-item">
          <div class="comment-head">
            <span class="comment-name">${escapeHtml(c.name)}</span>
            <span class="comment-date">${date}</span>
          </div>
          <div class="comment-content">${escapeHtml(c.content)}</div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('comment-submit').addEventListener('click', async () => {
    const name = document.getElementById('comment-name').value.trim();
    const email = document.getElementById('comment-email').value.trim();
    const content = document.getElementById('comment-content').value.trim();
    const status = document.getElementById('comment-status');

    if (!name || !content) {
      status.textContent = 'Please add your name and a comment.';
      status.style.color = '#f87171';
      return;
    }
    if (!currentPost) return;

    status.textContent = 'Posting…';
    status.style.color = 'var(--muted)';

    const { error } = await sb.from('comments').insert({
      post_id: currentPost.id, name, email: email || null, content
    });

    if (error) {
      status.textContent = 'Something went wrong — please try again.';
      status.style.color = '#f87171';
      console.error(error);
      return;
    }

    document.getElementById('comment-name').value = '';
    document.getElementById('comment-email').value = '';
    document.getElementById('comment-content').value = '';
    status.textContent = 'Posted!';
    status.style.color = 'var(--green)';
    loadComments(currentPost.id);
  });

  loadPost();
</script>
</body>
</html>
